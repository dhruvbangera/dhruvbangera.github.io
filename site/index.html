<link rel="stylesheet" href="card.css">
<style>
  /* Follows the iOS Contacts contact-view idiom, not the Settings idiom:
     circular tinted buttons with captions for ACTIONS, and label-over-value
     rows for DATA. No chevrons anywhere — a chevron means "drills into another
     screen", and none of these do. */

  .wrap { max-width: 24rem; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
  .sheet { background:#fff; border-radius:1.25rem; overflow:hidden;
           box-shadow:0 1px 2px rgba(11,12,12,.06), 0 12px 32px rgba(11,12,12,.08); }

  /* --- Actions: circular tinted buttons, caption beneath --- */
  .actions { display:flex; justify-content:center; gap:1.75rem;
             padding:1.5rem 1rem 1.75rem; border-top:1px solid var(--hairline); }
  .action { display:flex; flex-direction:column; align-items:center; gap:.5rem;
            text-decoration:none; -webkit-tap-highlight-color:transparent; }
  .action__btn { width:3.25rem; height:3.25rem; border-radius:50%;
                 display:grid; place-items:center;
                 background:rgba(2,81,114,.10); color:var(--pt-teal);
                 transition:background .15s ease; }
  .action:active .action__btn { background:rgba(2,81,114,.22); }
  .action__btn svg { width:1.45rem; height:1.45rem; display:block; }
  .action__label { font-size:.75rem; font-weight:400; color:var(--pt-teal); letter-spacing:0; }

  /* --- Data: label over value, the Contacts row --- */
  .fields { border-top:1px solid var(--hairline); }
  .field { display:block; padding:.7rem 1.25rem; text-decoration:none;
           border-bottom:1px solid var(--hairline); -webkit-tap-highlight-color:transparent; }
  .field:last-child { border-bottom:0; }
  .field:active { background:#f4f6f7; }
  .field__label { display:block; font-size:.75rem; color:var(--muted); margin-bottom:.1rem; }
  .field__value { display:block; font-size:.9375rem; color:var(--pt-teal);
                  overflow-wrap:anywhere; }

  .hint { margin:1.25rem .25rem 0; font-size:.8125rem; line-height:1.5; color:var(--muted); }
  .hint b { color:var(--ink); font-weight:600; }

  /* The hint is the ONLY text outside the white sheet, so it is the only thing
     that must flip with the colour scheme. Every --ink/--muted use inside .sheet
     sits on white in both schemes and must NOT be flipped. */
  @media (prefers-color-scheme: dark) {
    body { background:#000; }
    .hint { color:#8b949a; }
    .hint b { color:#f2f3f5; }   /* was inheriting --ink, near-black: invisible here */
  }
</style>
</head>
<body>

        </span>

    Keep this card: tap <b>Share</b>, then <b>Add to Home Screen</b>.

</main>
<script>
  // Teach Add to Home Screen only on iOS Safari, and only when not already installed.
  // iOS gives no programmatic install prompt, so this is the only available affordance.
  (function () {
    var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
    var standalone = window.navigator.standalone === true ||
      window.matchMedia('(display-mode: standalone)').matches;
    if (isIOS && !standalone) document.getElementById('a2hs').hidden = false;
  })();
</script>
</body>
</html>
